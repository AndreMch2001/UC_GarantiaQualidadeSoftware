# Pipeline de integração contínua (Aula 04/05 — Bloco 4).
# A cada push ou pull request: compila, roda TODOS os testes e aplica o gate de cobertura.
# Se qualquer teste falhar ou a cobertura do pacote de regras ficar abaixo de 80%,
# o mvn devolve código de saída diferente de 0 e o merge é bloqueado.
name: CI

on: [push, pull_request]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes + gate de cobertura (JaCoCo)
        run: mvn -B verify

      - name: Publicar relatório de cobertura como evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
